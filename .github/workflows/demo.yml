name: CI Example

# 1. როდის გაეშვას (ტრიგერი)
on:
  push:
    branches: [ "main" ]

# 2. რა სამუშაო შეასრულოს
jobs:
  build:
    runs-on: ubuntu-latest # ვირტუალური გარემო

    steps:
      # ნაბიჯი 1: კოდის გადმოწერა რეპოზიტორიიდან
      - name: Checkout repository
        uses: actions/checkout@v4

      # ნაბიჯი 2: მარტივი ბრძანების გაშვება
      - name: Run a one-line script
        run: echo "Hello, world! GitHub Actions მუშაობს!"
